name: "Testing for supported architectures"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always


jobs:
  test-linux:

    name: ${{ matrix.distro }} (64-bit) test

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - distro: ubuntu
            container: "ubuntu:24.04"
          - distro: debian
            container: "debian:bookworm-slim"
          - distro: fedora
            container: "fedora:40"

    container:
      image: ${{ matrix.container }}

    steps:
      # Step 1a
      - name: Install System Dependencies (Ubuntu/Debian)
        if: matrix.distro == 'ubuntu' || matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y git curl build-essential

      # Step 1b
      - name: Install System Dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf check-update || true
          dnf groupinstall -y "Development Tools"
          dnf install -y git curl

      # Step 2: Bring the repository code into the container
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 3: Install the official Rust toolchain via rustup
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 4: Cache dependencies so you don't rebuild them from scratch every run
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}

      # Step 5: Execute your test cases
      - name: Run Cargo Tests
        run: cargo test --workspace --all-targets --features sqlite

  test-windows:

    name: windows (64-bit) test

    runs-on: windows-latest

    steps:
      # Step 1: Bring the repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install the official Rust toolchain via rustup (MSVC target)
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 3: Cache dependencies so you don't rebuild them from scratch every run
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # Step 4: Execute your test cases
      - name: Run Cargo Tests
        run: cargo test --workspace --all-targets --features sqlite

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.os }}
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features sqlite -- -D warnings

  # Makes sure the project generated by scripts/builder.sh still compiles against the current library
  scaffold:
    name: scaffold script (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: scaffold
          workspaces: ${{ runner.temp }}/demo
      - name: Generate a project
        run: ./scripts/builder.sh "$RUNNER_TEMP/demo"
      - name: Build the generated project
        working-directory: ${{ runner.temp }}/demo
        run: cargo build

  # Same check for scripts/builder.ps1, under both Windows PowerShell 5.1 and PowerShell 7
  scaffold-windows:
    name: scaffold script (windows, ${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: scaffold-windows-${{ matrix.shell }}
          workspaces: ${{ runner.temp }}/demo
      - name: Generate a project
        run: ./scripts/builder.ps1 "$env:RUNNER_TEMP/demo"
      - name: Build the generated project
        working-directory: ${{ runner.temp }}/demo
        run: cargo build