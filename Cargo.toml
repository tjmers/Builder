[package]
name = "builder"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
actix-web = { version = "4.18.1", default-features = false }
axum = "0.8.9"
criterion = "0.8.2"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "compare"
harness = false